name: Edge Functions release

on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'scripts/supabase-edge-release.mjs'
      - 'scripts/__tests__/supabase-edge-release.test.mjs'
      - '.github/workflows/edge-functions-release.yml'
      - 'package.json'
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY-FUNCTIONS to deploy all production Edge Functions.
        required: true
        type: string

jobs:
  contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run supabase:edge:test

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY-FUNCTIONS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: cbyikdryogktctskvzzk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Check deployment secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repository secret is required."
            exit 1
          fi
      - run: npm run supabase:edge:test
      - name: Deploy all production functions
        run: npm run supabase:functions:deploy
